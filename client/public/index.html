<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <meta name="description" content="Aide et support informatique aux étudiants de l'UNamur." />
    
    <title>Aide | E-kot</title>
    <!-- Apply the light/dark theme before the page is drawn (no flash). Same logic as src/stores/theme.js -->
    <script>
        try {
            var theme = localStorage.getItem('aide-theme');
            if (theme !== 'dark' && theme !== 'light') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.className = theme + '-theme';
        } catch (e) {}
    </script>
    <link rel='stylesheet' href='chota.min.css'>
    <link rel='icon' type='image/png' href='/images/logo.webp'>
    <link rel='stylesheet' href='/global.css'>
    <link rel='stylesheet' href='/build/bundle.css'>

    <script defer src='/build/bundle.js'></script>
</head>

</html>
